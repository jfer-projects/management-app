# Fly.io config. Change `app` to the name of your Fly app if it differs.
app = "management-app"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"
  DATA_DIR = "/data"
  PORT = "3000"

# SQLite lives on this volume, so run exactly ONE machine. Do not scale out.
[[mounts]]
  source = "rental_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Must stay running: reminder emails and daily backup snapshots run on a timer inside the app.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/session"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
